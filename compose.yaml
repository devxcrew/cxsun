services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${CXSUN_DB_ROOT_PASSWORD:?Set a database root password in .env}
      MARIADB_DATABASE: ${CXSUN_DB_NAME:-cxsun}
      MARIADB_USER: ${CXSUN_DB_USER:?Set a database user in .env}
      MARIADB_PASSWORD: ${CXSUN_DB_PASSWORD:?Set a database password in .env}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["database:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
    command: ["redis-server", "--appendonly", "yes"]
  app:
    profiles: ["app"]
    build: .
    ports: ["127.0.0.1:4100:4100"]
    environment:
      HOST: 0.0.0.0
      PORT: 4100
  nginx:
    profiles: ["proxy"]
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./deployments/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
  media:
    profiles: ["media"]
    image: filebrowser/filebrowser:latest
    ports: ["127.0.0.1:8081:80"]
    volumes: ["media:/srv", "media-state:/database"]
volumes:
  database:
  redis:
  media:
  media-state:
